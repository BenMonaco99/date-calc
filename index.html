<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Date Week Calculator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #64748b;
      margin-bottom: 2rem;
    }

    label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    input[type="date"] {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      color: #f1f5f9;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
      color-scheme: dark;
    }

    input[type="date"]:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .results {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .result-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 1.25rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .result-box.highlight {
      border-color: #6366f1;
      background: #1a1f3d;
    }

    .result-label {
      font-size: 0.875rem;
      color: #94a3b8;
      line-height: 1.4;
    }

    .result-label strong {
      display: block;
      color: #cbd5e1;
      font-size: 0.9375rem;
      margin-bottom: 0.125rem;
    }

    .result-value {
      font-size: 2rem;
      font-weight: 800;
      color: #a5b4fc;
      white-space: nowrap;
      text-align: right;
    }

    .result-value .unit {
      font-size: 0.875rem;
      font-weight: 500;
      color: #64748b;
      display: block;
      text-align: right;
    }

    .result-value.negative {
      color: #f87171;
    }

    .today-line {
      font-size: 0.8125rem;
      color: #475569;
      text-align: center;
      margin-top: 1.5rem;
    }

    .placeholder {
      margin-top: 2rem;
      padding: 2rem;
      border: 1px dashed #334155;
      border-radius: 0.75rem;
      text-align: center;
      color: #475569;
      font-size: 0.9375rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Week Calculator</h1>
    <p class="subtitle">Find out how many weeks away a date is</p>

    <label for="target-date">Target date</label>
    <input type="date" id="target-date" />

    <div id="output">
      <div class="placeholder">Enter a date above to see results</div>
    </div>

    <p class="today-line" id="today-label"></p>
  </div>

  <script>
    const input = document.getElementById("target-date");
    const output = document.getElementById("output");
    const todayLabel = document.getElementById("today-label");

    function toLocalDateOnly(dateStr) {
      const [y, m, d] = dateStr.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function todayDateOnly() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }

    function weeksAway(targetDate, fromDate) {
      const diffMs = targetDate - fromDate;
      const diffDays = diffMs / (1000 * 60 * 60 * 24);
      return Math.ceil(diffDays / 7);
    }

    function renderResults(dateStr) {
      const target = toLocalDateOnly(dateStr);
      const today = todayDateOnly();
      const plusTwo = new Date(today);
      plusTwo.setDate(plusTwo.getDate() + 14);

      const weeksFromToday = weeksAway(target, today);
      const weeksFromPlusTwo = weeksFromToday + 2;

      const sign = (n) => (n < 0 ? "" : "+");
      const cls = (n) => (n < 0 ? "result-value negative" : "result-value");

      output.innerHTML = `
        <div class="results">
          <div class="result-box">
            <div class="result-label">
              <strong>From today</strong>
              ${target.toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" })}
            </div>
            <div class="${cls(weeksFromToday)}">
              ${sign(weeksFromToday)}${weeksFromToday}
              <span class="unit">weeks</span>
            </div>
          </div>
          <div class="result-box highlight">
            <div class="result-label">
              <strong>From today +2 weeks</strong>
              ${plusTwo.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })}
            </div>
            <div class="${cls(weeksFromPlusTwo)}">
              ${sign(weeksFromPlusTwo)}${weeksFromPlusTwo}
              <span class="unit">weeks</span>
            </div>
          </div>
        </div>
      `;
    }

    function init() {
      const today = todayDateOnly();
      todayLabel.textContent = `Today is ${today.toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" })}`;
    }

    input.addEventListener("change", () => {
      if (input.value) renderResults(input.value);
      else output.innerHTML = '<div class="placeholder">Enter a date above to see results</div>';
    });

    init();
  </script>
</body>
</html>
